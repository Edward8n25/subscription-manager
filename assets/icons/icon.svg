<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 订阅管理 · 图标（1.2.0 定稿）：纯几何、无文字、无渐变 —— 与戒断工具同一设计语言
       （深底 + 白色几何 + 品牌绿点），缩到 16px 仍可辨认，且不依赖任何平台字形。
       语义：日历框 = 计费周期；顶部两挂耳 = 月历；底部绿点 = 到期日（订阅的「哪天扣钱」）。 -->
  <rect width="512" height="512" rx="112" fill="#121212"/>
  <rect x="132" y="148" width="248" height="228" rx="36" fill="none" stroke="#ffffff" stroke-width="36"/>
  <line x1="132" y1="232" x2="380" y2="232" stroke="#ffffff" stroke-width="36"/>
  <line x1="204" y1="118" x2="204" y2="172" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <line x1="308" y1="118" x2="308" y2="172" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <circle cx="256" cy="316" r="30" fill="#1db954"/>
</svg>
